<title>Let's Play — NumeriFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;--green-deeper:#085041;
  --purple:#7F77DD;--purple-light:#EEEDFE;--purple-dark:#534AB7;
  --amber:#EF9F27;--amber-light:#FAEEDA;--amber-dark:#854F0B;
  --coral:#D85A30;--coral-light:#FAECE7;--coral-dark:#993C1D;
  --white:#FFFFFF;--gray-50:#F8F7F4;--gray-100:#F0EEE9;
  --gray-200:#D3D1C7;--gray-400:#888780;--gray-900:#2C2C2A;
}

html{font-size:16px}

body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  padding:0 0 140px;
  overflow-x:hidden;
  position:relative;
  background:var(--gray-50);
}

/* ── Coloured top band per game type ── */
.game-header{
  width:100%;padding:16px 20px;
  display:flex;align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

.game-header.counting  {background:linear-gradient(135deg,#1D9E75,#0F6E56);}
.game-header.comparison{background:linear-gradient(135deg,#EF9F27,#B87616);}
.game-header.patterns  {background:linear-gradient(135deg,#7F77DD,#534AB7);}
.game-header.music     {background:linear-gradient(135deg,#EC407A,#A01050);}
.game-header.arithmetic{background:linear-gradient(135deg,#D85A30,#993C1D);}

.header-left{display:flex;align-items:center;gap:10px;}
.back-btn{
  background:rgba(255,255,255,0.2);border:none;border-radius:50%;
  width:36px;height:36px;cursor:pointer;color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.back-btn:hover{background:rgba(255,255,255,0.35);}

.game-title-label{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:18px;color:#fff;
}

.header-right{display:flex;align-items:center;gap:10px;}

/* Stars in header */
.header-stars{display:flex;gap:3px;}
.hstar{font-size:18px;transition:transform .3s;}
.hstar.earned{animation:starPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}

/* Score pill */
.score-pill{
  background:rgba(255,255,255,0.2);
  border-radius:20px;padding:4px 12px;
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:15px;color:#fff;
}

/* Level badge */
.level-badge{
  background:rgba(255,255,255,0.25);
  border-radius:20px;padding:4px 12px;
  font-size:12px;font-weight:800;color:#fff;
}

/* ── Main content area ── */
.main{
  max-width:560px;margin:0 auto;
  padding:24px 16px;
}

/* ── Question card ── */
.q-card{
  background:var(--white);
  border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);
  padding:28px 24px;
  margin-bottom:16px;
  animation:cardIn .35s cubic-bezier(.25,.46,.45,.94);
  position:relative;overflow:hidden;
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.q-number{
  font-size:11px;font-weight:800;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--gray-400);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}

.q-progress-bar{
  flex:1;background:var(--gray-100);
  border-radius:20px;height:5px;overflow:hidden;
}
.q-progress-fill{
  height:5px;border-radius:20px;
  background:var(--green);
  transition:width .5s ease;
}

.question-text{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:22px;color:var(--gray-900);
  margin-bottom:20px;line-height:1.3;text-align:center;
}

/* Emoji grid for counting */
.emoji-display{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-bottom:20px;
  font-size:36px;max-width:380px;margin-left:auto;margin-right:auto;
}

/* Number boxes for comparison */
.compare-display{
  display:flex;align-items:center;
  gap:20px;justify-content:center;margin-bottom:24px;
}
.num-box{
  min-width:80px;height:80px;border-radius:16px;
  background:var(--gray-50);border:2px solid var(--gray-200);
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',sans-serif;font-weight:900;
  font-size:32px;color:var(--gray-900);padding:0 12px;
}
.num-box.big-num{font-size:22px;}
.vs-text{font-size:14px;font-weight:800;color:var(--gray-400);text-transform:uppercase;}

/* Sequence display */
.seq-display{
  display:flex;align-items:center;gap:8px;
  justify-content:center;margin-bottom:24px;
  flex-wrap:wrap;
}
.seq-box{
  width:52px;height:52px;border-radius:12px;
  background:var(--gray-100);border:2px solid var(--gray-200);
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',sans-serif;font-weight:900;
  font-size:18px;color:var(--gray-900);
}
.seq-box.unknown{
  background:var(--white);border-style:dashed;
  color:var(--gray-400);font-size:24px;
}

/* Fraction display */
.fraction-display{
  display:flex;gap:8px;justify-content:center;
  margin-bottom:20px;flex-wrap:wrap;
}
.frac-box{
  width:28px;height:28px;border-radius:6px;
  border:2px solid var(--gray-200);
  background:var(--gray-100);
  transition:all .3s;
}
.frac-box.filled{background:var(--green);border-color:var(--green-dark);}

/* ── Answer buttons ── */
.answers{
  display:grid;
  gap:10px;
}
.answers.two-col{grid-template-columns:1fr 1fr;}
.answers.one-col{grid-template-columns:1fr;}

.ans-btn{
  padding:14px 16px;
  border-radius:16px;
  border:2.5px solid var(--gray-200);
  background:var(--white);
  font-family:'Baloo 2',sans-serif;
  font-weight:800;font-size:18px;
  color:var(--gray-900);
  cursor:pointer;
  transition:all .15s;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  text-align:center;
}
.ans-btn:hover{border-color:var(--green);background:var(--green-light);transform:scale(1.02);}
.ans-btn.correct{
  background:var(--green-light);border-color:var(--green);
  color:var(--green-dark);transform:scale(1.04);
}
.ans-btn.wrong{
  background:var(--coral-light);border-color:var(--coral);
  color:var(--coral-dark);animation:wrongShake .4s ease;
}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.cmp-btn{
  padding:12px 24px;border-radius:14px;
  border:2.5px solid var(--gray-200);background:var(--white);
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;
  color:var(--gray-900);cursor:pointer;transition:all .15s;
}
.cmp-btn:hover{border-color:var(--green);background:var(--green-light);}
.cmp-btn.correct{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
.cmp-btn.wrong{background:var(--coral-light);border-color:var(--coral);color:var(--coral-dark);}

/* Feedback message */
.feedback{
  text-align:center;font-family:'Baloo 2',sans-serif;
  font-weight:800;font-size:18px;
  margin-top:14px;min-height:24px;
  transition:all .2s;
}
.feedback.good{color:var(--green-dark);}
.feedback.bad{color:var(--coral-dark);}

/* ── Music therapy section ── */
.music-panel{display:flex;flex-direction:column;align-items:center;width:100%;}
.music-intro{font-size:13px;color:var(--gray-400);text-align:center;margin-bottom:16px;line-height:1.6;max-width:360px;}

.beat-pattern-display{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}
.beat-cell{
  width:40px;height:40px;border-radius:10px;
  background:var(--gray-100);border:2px solid var(--gray-200);
  transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.beat-cell.active-beat{background:var(--green);border-color:var(--green-dark);transform:scale(1.15);}
.beat-cell.match{background:var(--green);border-color:var(--green-dark);}
.beat-cell.miss{background:var(--coral-light);border-color:var(--coral);}
.beat-cell.user-beat{background:var(--purple);border-color:var(--purple-dark);}

.rhythm-pads{display:flex;gap:12px;justify-content:center;margin:16px 0;}
.pad{
  width:68px;height:68px;border-radius:16px;
  cursor:pointer;border:none;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;transition:all .1s;
}
.pad:hover{transform:scale(1.06);}
.pad.beat{transform:scale(.88);box-shadow:0 2px 4px rgba(0,0,0,.1);}
.pad-g{background:var(--green);}
.pad-p{background:var(--purple);}
.pad-a{background:var(--amber);}
.pad-c{background:var(--coral);}

.melody-keys{display:flex;gap:5px;justify-content:center;margin:10px 0;}
.mel-key{
  width:46px;height:80px;border-radius:10px;cursor:pointer;border:none;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12px;
  color:rgba(255,255,255,0.9);display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:8px;
  box-shadow:0 4px 8px rgba(0,0,0,.15);transition:all .1s;
}
.mel-key:hover{transform:translateY(-4px);box-shadow:0 8px 16px rgba(0,0,0,.2);}
.mel-key.playing{transform:translateY(2px);box-shadow:0 1px 3px rgba(0,0,0,.1);}

/* ── Level up celebration overlay ── */
.levelup-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.5);
  z-index:300;
  display:none;
  align-items:center;justify-content:center;
  animation:fadeIn .3s ease;
}
.levelup-overlay.show{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.levelup-card{
  background:var(--white);border-radius:28px;
  padding:40px 36px;text-align:center;
  max-width:340px;width:90%;
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 24px 64px rgba(0,0,0,.2);
}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

.levelup-emoji{font-size:64px;margin-bottom:16px;display:block;animation:bounce 1s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.levelup-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;color:var(--gray-900);margin-bottom:8px;}
.levelup-sub{font-size:15px;color:var(--gray-400);margin-bottom:24px;line-height:1.6;}
.levelup-btn{
  width:100%;padding:14px;border-radius:16px;
  background:var(--green);color:#fff;border:none;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;
  cursor:pointer;transition:all .2s;
  box-shadow:0 6px 20px rgba(29,158,117,.35);
}
.levelup-btn:hover{transform:translateY(-2px);}

/* ── Session complete overlay ── */
.complete-overlay{
  position:fixed;inset:0;
  background:linear-gradient(135deg,var(--green-light),var(--purple-light));
  z-index:300;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;padding:24px;
}
.complete-overlay.show{display:flex;animation:fadeIn .4s ease;}
.complete-card{
  background:var(--white);border-radius:28px;
  padding:36px 32px;text-align:center;
  max-width:380px;width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,.12);
}
.complete-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;}
.complete-stat{background:var(--gray-50);border-radius:14px;padding:14px;}
.complete-stat-val{font-family:'Baloo 2',sans-serif;font-weight:900;font-size:28px;color:var(--gray-900);}
.complete-stat-lbl{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}

/* ════════════════════
   PIP THE FOX (compact)
════════════════════ */
.pip-wrap{
  position:fixed;bottom:0;right:16px;
  width:110px;z-index:100;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.pip-ground{width:110px;height:10px;background:linear-gradient(90deg,#A8D5B5,#C5E8D0,#A8D5B5);border-radius:50% 50% 0 0/100% 100% 0 0;}
.pip-bubble{
  position:absolute;bottom:140px;right:8px;
  background:var(--white);border-radius:14px 14px 4px 14px;
  padding:8px 12px;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:12px;color:var(--gray-900);
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  max-width:150px;text-align:center;line-height:1.4;
  border:2px solid var(--gray-100);pointer-events:none;
  animation:bubbleIn .35s cubic-bezier(.34,1.56,.64,1);
}
.pip-bubble.hidden{display:none;}
@keyframes bubbleIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

.pip-body-group{animation:pipBreath 3s ease-in-out infinite;transform-origin:bottom center;}
@keyframes pipBreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}

.pip-wrap.happy .pip-body-group{animation:pipJump .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes pipJump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-8deg)}60%{transform:translateY(-14px) rotate(6deg)}80%{transform:translateY(-4px) rotate(-2deg)}}

.pip-wrap.celebrate .pip-body-group{animation:pipCelebrate .8s cubic-bezier(.34,1.56,.64,1);}
@keyframes pipCelebrate{0%,100%{transform:translateY(0) scale(1) rotate(0)}25%{transform:translateY(-28px) scale(1.1) rotate(-15deg)}50%{transform:translateY(-36px) scale(1.15) rotate(15deg)}75%{transform:translateY(-18px) scale(1.05) rotate(-8deg)}}

.pip-wrap.sad .pip-body-group{animation:pipSad .5s ease;}
@keyframes pipSad{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-5deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(4px) rotate(3deg)}}

.pip-wrap.run .pip-body-group{animation:pipRun .4s ease infinite;}
@keyframes pipRun{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.pip-tail{transform-origin:15% 50%;animation:tailWag 1.2s ease-in-out infinite;}
@keyframes tailWag{0%,100%{transform:rotate(0deg)}33%{transform:rotate(18deg)}66%{transform:rotate(-12deg)}}
.pip-wrap.happy .pip-tail,.pip-wrap.celebrate .pip-tail{animation:tailWagFast .3s ease-in-out infinite;}
@keyframes tailWagFast{0%,100%{transform:rotate(0deg)}50%{transform:rotate(25deg)}}

.pip-eye-l,.pip-eye-r{animation:eyeBlink 4s ease-in-out infinite;}
.pip-eye-r{animation-delay:.08s;}
@keyframes eyeBlink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* Floating reward emojis */
.float-reward{
  position:fixed;pointer-events:none;
  font-size:28px;z-index:200;
  animation:floatUp 1.2s ease both;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.4)}}

/* Responsive */
@media(max-width:480px){
  .question-text{font-size:18px;}
  .ans-btn{font-size:16px;padding:12px;}
  .num-box{width:68px;height:68px;font-size:26px;}
  .pip-wrap{width:90px;right:8px;}
}
</style>
<script src="nf-core.js"></script>
</head>
<body>

<!-- ════ GAME HEADER ════ -->
<div class="game-header" id="gameHeader" role="banner">
  <div class="header-left">
    <button class="back-btn" onclick="goBack()" aria-label="Back to games">←</button>
    <div class="game-title-label" id="gameTitleLabel">Loading...</div>
  </div>
  <div class="header-right">
    <div class="header-stars" id="headerStars" aria-label="Stars earned"></div>
    <div class="score-pill" id="scorePill">0</div>
    <div class="level-badge" id="levelBadge">Level 1</div>
  </div>
</div>

<!-- ════ MAIN CONTENT ════ -->
<div class="main" role="main">

  <!-- Question card -->
  <div class="q-card" id="qCard">
    <div class="q-number">
      <span id="qNumberText">Question 1</span>
      <div class="q-progress-bar"><div class="q-progress-fill" id="qProgressFill" style="width:0%"></div></div>
    </div>
    <div class="question-text" id="questionText">Loading...</div>
    <div id="questionVisual"></div>
    <div class="answers" id="answersArea"></div>
    <div class="feedback" id="feedback" aria-live="assertive"></div>
  </div>

</div>

<!-- ════ LEVEL UP OVERLAY ════ -->
<div class="levelup-overlay" id="levelUpOverlay" role="dialog" aria-modal="true" aria-labelledby="levelUpTitle">
  <div class="levelup-card">
    <span class="levelup-emoji" id="levelUpEmoji" aria-hidden="true">🎉</span>
    <div class="levelup-title" id="levelUpTitle">Level Up!</div>
    <div class="levelup-sub" id="levelUpSub">You're getting better and better!</div>
    <button class="levelup-btn" onclick="dismissLevelUp()">Keep going! →</button>
  </div>
</div>

<!-- ════ SESSION COMPLETE OVERLAY ════ -->
<div class="complete-overlay" id="completeOverlay" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
  <div class="complete-card">
    <div style="font-size:64px;margin-bottom:12px;" aria-hidden="true" id="completeEmoji">🏆</div>
    <div class="levelup-title" id="completeTitle">Amazing work!</div>
    <div style="font-size:14px;color:var(--gray-400);margin-bottom:4px;" id="completeSub">Session complete</div>
    <div class="complete-stat-grid">
      <div class="complete-stat">
        <div class="complete-stat-val" id="statAnswered">0</div>
        <div class="complete-stat-lbl">Answered</div>
      </div>
      <div class="complete-stat">
        <div class="complete-stat-val" id="statCorrectCount">0</div>
        <div class="complete-stat-lbl">Correct</div>
      </div>
      <div class="complete-stat">
        <div class="complete-stat-val" id="statStarsEarned">0</div>
        <div class="complete-stat-lbl">Stars earned</div>
      </div>
      <div class="complete-stat">
        <div class="complete-stat-val" id="statStreakBest">0</div>
        <div class="complete-stat-lbl">Best streak</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="levelup-btn" style="background:var(--purple);" onclick="playAgain()">Play again! 🎮</button>
      <button class="levelup-btn" onclick="goBack()">Choose game 🏠</button>
    </div>
  </div>
</div>

<!-- ════ PIP THE FOX ════ -->
<div class="pip-wrap" id="pip" onclick="pipTap()" role="img" aria-label="Pip the fox">
  <div class="pip-bubble hidden" id="pipBubble" aria-live="polite"></div>
  <!--
    Pip v2 — redesigned to match emoji reference:
    rounder head, much larger eyes with warm brown irises,
    softer ear shape, cleaner belly patch, fuller tail
  -->
  <svg class="pip-body-group" width="120" height="130" viewBox="0 0 140 155" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="pipBodyGrad" cx="45%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#FF9A3C"/>
        <stop offset="100%" stop-color="#E06000"/>
      </radialGradient>
      <radialGradient id="pipBellyGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFF0DC"/>
        <stop offset="100%" stop-color="#FFD9A0"/>
      </radialGradient>

    <!-- Tail — fuller, curls behind -->

const rnd    = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick   = a => a[rnd(0,a.length-1)];
const shuffle= a => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=rnd(0,i);[r[i],r[j]]=[r[j],r[i]];} return r; };

// Ensure exactly 4 unique positive options including the correct answer
function uniqueOpts(answer, candidates, isStr){
  const toStr = v => isStr ? String(v) : v;
  const ans = toStr(answer);
  const seen = new Set([String(ans)]);
  const result = [ans];
  for(const c of candidates){
    const cv = toStr(c);
    if(!seen.has(String(cv)) && Number(cv) > 0){
      seen.add(String(cv)); result.push(cv);
      if(result.length === 4) break;
    }
  }
  // Pad with nearby values if fewer than 4
  let pad = Number(answer); let dir = 1;
  while(result.length < 4){
    pad += dir;
    const pv = toStr(pad);
    if(!seen.has(String(pv)) && pad > 0){ seen.add(String(pv)); result.push(pv); }
    dir = dir > 0 ? -(dir) : Math.abs(dir)+1;
    if(Math.abs(dir) > 100) break;
  }
  return shuffle(result);
}

let audioCtx = null;
let _audioUnlocked = false;

// Call this on first user gesture to unlock audio on iOS/Safari
function unlockAudio(){
  if(_audioUnlocked) return;
  _audioUnlocked = true;
  if(!audioCtx) audioCtx = new(window.AudioContext||window.webkitAudioContext)();
  // Play a silent buffer to unlock
  const buf = audioCtx.createBuffer(1,1,22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

async function getAudio(){
  if(!audioCtx) audioCtx = new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended'){
    try { await audioCtx.resume(); } catch(e){ console.warn('AudioContext resume failed:', e); }
  }
  return audioCtx;
}

async function playToneAsync(freq, type='sine', dur=0.3, vol=0.4){
  try {
    const ctx = await getAudio();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e){ console.warn('playTone failed:', e); }
}
// Haptic feedback for mobile devices
function haptic(pattern){
  if(navigator&&navigator.vibrate){ try{navigator.vibrate(pattern);}catch(e){} }
}

function playTone(freq,type='sine',dur=0.3,vol=0.4){
  playToneAsync(freq,type,dur,vol); // async internally
}
function _playToneSync(freq,type,dur,vol){
  if(!audioCtx||audioCtx.state!=='running') return;
  const ctx=audioCtx; const o=ctx.createOscillator(); const g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination);

  g.gain.setValueAtTime(vol,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
  o.start(ctx.currentTime); o.stop(ctx.currentTime+dur);
}

(function init(){

  const fromAge = child?.age ? ageToYear(parseInt(child.age)) : 'Year 1';
  year = (rawYear && CURRICULUM_CONFIG[rawYear]) ? rawYear
       : (fromAge && CURRICULUM_CONFIG[fromAge]) ? fromAge
       : 'Year 1';

  // Get level for this specific game type from assessment
  const skillMap = { counting:'counting', comparison:'comparison', patterns:'patterns', arithmetic:'arithmetic', music:'rhythm' };
  const skillKey = skillMap[gameType] || 'counting';
  const skillScore = assessment?.skills?.[skillKey] || 50;
  level = scoreToLevel(skillScore);

  // Setup UI
  setupHeader();
  renderStars();
  // Apply freemium question cap
  if (!NF.isPro() && NF.isFreemium()) sessionTarget = FREEMIUM_Q_CAP;
  nextQuestion();

  // Pip greeting
  setTimeout(()=>{
    pipAnimate('wave',1000);

function ageToYear(age){
  return {5:'Year 1',6:'Year 2',7:'Year 3',8:'Year 3',9:'Year 4',10:'Year 5',11:'Year 6'}[age]||'Year 1';
}

function scoreToLevel(score){
  if(score>=85) return 5;
  if(score>=70) return 4;
  if(score>=55) return 3;
  if(score>=40) return 2;
  if(score>=25) return 1;
  return 0;
}

// ══════════════════════════════════════════════════════════════
//  QUESTION GENERATION — year + level aware (UK National Curriculum)
//
//  Two dimensions combine:
//    YEAR  → determines WHAT is assessed (statutory curriculum objectives)
//    LEVEL → determines HOW HARD (number range, distractor proximity, ops)
//
//  Year is read from nf_assessment.year (set during parent assessment).
//  Level is the child's assessed skill score mapped 0-5.
// ══════════════════════════════════════════════════════════════

// ── Master question dispatcher ────────────────────────────────
function makeQuestion(){
  // Validate year against config — hard guarantee
  const safeYear = (year && CURRICULUM_CONFIG[year]) ? year : 'Year 1';
  const cfg = CURRICULUM_CONFIG[safeYear];
  const lvl = Math.min(Math.max(level, 0), 5);

  // Validate cfg sections exist before passing
  const countCfg = cfg.counting   || CURRICULUM_CONFIG['Year 1'].counting;
  const cmpCfg   = cfg.comparison || CURRICULUM_CONFIG['Year 1'].comparison;
  const patCfg   = cfg.patterns   || CURRICULUM_CONFIG['Year 1'].patterns;
  const arithCfg = cfg.arithmetic || CURRICULUM_CONFIG['Year 1'].arithmetic;
  const musCfg   = cfg.music      || CURRICULUM_CONFIG['Year 1'].music;

  switch(gameType){
    case 'counting':   return makeCountingQ(countCfg, lvl);
    case 'comparison': return makeComparisonQ(cmpCfg, lvl);
    case 'patterns':   return makePatternsQ(patCfg, lvl);
    case 'arithmetic': return makeArithmeticQ(arithCfg, lvl);
    case 'music': {
      const r = qIndex % 3;
      return r === 0 ? makeRhythmQ(musCfg, lvl) : r === 1 ? makeMelodyQ(musCfg, lvl) : makeBeatCountQ(musCfg, lvl);
    }
    default:           return makeCountingQ(countCfg, lvl);
  }
}

// ── COUNTING ─────────────────────────────────────────────────
function makeCountingQ(cfg, lvl){
  const maxN  = cfg.maxCount[lvl];
  const n     = rnd(Math.max(1, Math.floor(maxN*0.3)), maxN);
  const sp    = lvl<=1?3:lvl<=3?2:1; // distractor spread tightens with level

  // Rotate through extras for variety
  const extras = cfg.extras || [];
  const extra  = extras.length ? extras[qIndex % extras.length] : null;

  // Extra question types specific to each year
  if(extra === 'onemore')     return { type:'mcq', question:'What is one more than '+n+'?', answer:String(n+1), options:shuffle([n+1,n,n+2,n-1].map(String)) };
  if(extra === 'oneless')     { const ans1=n>1?n-1:n+1; return { type:'mcq', question:'What is one less than '+n+'?', answer:String(ans1), options:uniqueOpts(ans1,[n,n+1,n+2,n+3,ans1+2],true) }; }
  if(extra === 'numberbond10'){ const a=rnd(1,9); const nb=10-a; return { type:'mcq', question:a+' + ? = 10', answer:String(nb), options:uniqueOpts(nb,[nb+1,nb-1,nb+2,nb+3].filter(x=>x>0&&x<=10),true) }; }
  if(extra === 'oddeven')     return { type:'mcq', question:'Is '+n+' odd or even?', answer:n%2===0?'Even':'Odd', options:['Odd','Even'] };
  if(extra === 'placevalue10s'){ const tens=rnd(1,9); const ones=rnd(0,9); const num=tens*10+ones; return { type:'mcq', question:'How many tens are in '+num+'?', answer:String(tens), options:shuffle([tens,tens+1,tens-1>0?tens-1:tens+2].concat([ones]).map(String)) }; }
  if(extra === 'onemoretens') { const base=rnd(1,8)*10; return { type:'mcq', question:'What is 10 more than '+base+'?', answer:String(base+10), options:shuffle([base+10,base+1,base+5,base+20].map(String)) }; }
  if(extra === 'placevalue100s'){ const h=rnd(2,9); const t=rnd(0,7); const o=rnd(0,7); const num3=h*100+t*10+o; return { type:'mcq', question:'What is the hundreds digit in '+num3+'?', answer:String(h), options:uniqueOpts(h,[t,o,h+1,h-1].filter(v=>v>=0&&v!==h),true) }; }
  if(extra === '100more')     { const base=rnd(1,8)*100+rnd(10,90); return { type:'mcq', question:'What is 100 more than '+base+'?', answer:String(base+100), options:shuffle([base+100,base+10,base+1000,base-100].map(String)) }; }
  if(extra === '100less')     { const base=rnd(2,9)*100+rnd(10,90); return { type:'mcq', question:'What is 100 less than '+base+'?', answer:String(base-100), options:shuffle([base-100,base-10,base-1,base+100].map(String)) }; }
  if(extra === 'roundto10')   { const raw=rnd(11,98); const r=Math.round(raw/10)*10; const f=Math.floor(raw/10)*10; const c=Math.ceil(raw/10)*10; return { type:'mcq', question:'Round '+raw+' to the nearest 10.', answer:String(r), options:uniqueOpts(r,[f,c,r+10,r-10,r+20].filter(v=>v>=0),true) }; }
  if(extra === 'roundto100')  { const raw=rnd(101,999); const r=Math.round(raw/100)*100; return { type:'mcq', question:'Round '+raw+' to the nearest 100.', answer:String(r), options:shuffle([r,Math.floor(raw/100)*100,Math.ceil(raw/100)*100,r+100].filter((v,i,a)=>a.indexOf(v)===i).map(String).slice(0,4)) }; }
  if(extra === 'roundto1000') { const raw=rnd(1001,9999); const r=Math.round(raw/1000)*1000; return { type:'mcq', question:'Round '+raw.toLocaleString()+' to the nearest 1,000.', answer:r.toLocaleString(), options:shuffle([r,Math.floor(raw/1000)*1000,Math.ceil(raw/1000)*1000,r+1000].map(v=>v.toLocaleString()).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4)) }; }
  if(extra === 'placevalue1000s'){ const th=rnd(1,9); const h=rnd(0,9); const num4=th*1000+h*100+rnd(0,99); return { type:'mcq', question:'What is the value of the thousands digit in '+num4.toLocaleString()+'?', answer:(th*1000).toLocaleString(), options:shuffle([th*1000,h*100,rnd(1,9)*1000,(th+1)*1000].map(v=>v.toLocaleString()).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4)) }; }
  if(extra === 'negcount')    { const a=-rnd(1,10); const b=rnd(1,10); const correct=a>b?'left':b>a?'right':'equal'; return { type:'compare', question:'Which number is bigger?', numA:a, numB:b, correctSide:correct }; }
  if(extra === 'prime')       { const primes=[2,3,5,7,11,13,17,19]; const composites=[4,6,8,9,10,12,14,15,16,18,20]; const p=pick(primes); const nonPrimes=shuffle(composites.filter(x=>x!==p&&!primes.includes(x))).slice(0,3); return { type:'mcq', question:'Which of these is a prime number?', answer:String(p), options:uniqueOpts(p,nonPrimes,true) }; }
  if(extra === 'powersof10')  { const pw=pick([10,100,1000,10000]); const base=rnd(2,9); return { type:'mcq', question:base+' × '+pw.toLocaleString()+' = ?', answer:(base*pw).toLocaleString(), options:shuffle([base*pw,base*pw*10,base*pw/10,base*pw+pw].map(v=>v.toLocaleString())) }; }
  if(extra === 'roundmillion'){ const raw=rnd(100001,999999); const r=Math.round(raw/100000)*100000; return { type:'mcq', question:'Round '+raw.toLocaleString()+' to the nearest 100,000.', answer:r.toLocaleString(), options:shuffle([r,r-100000,r+100000,r+200000].filter(v=>v>0).map(v=>v.toLocaleString()).slice(0,4)) }; }
  if(extra === 'algebra')     { const a=rnd(2,9); const b=rnd(2,9); const c=rnd(1,9); const ans=b; return { type:'mcq', question:a+'n + '+c+' = '+(a*b+c)+'. What is n?', answer:String(ans), options:shuffle([ans,ans+1,ans-1,ans+2].map(String)) }; }
  if(extra === 'ratio')       { const r1=rnd(1,4); const r2=rnd(1,4); const total=(r1+r2)*rnd(2,6); const share=Math.round(total/(r1+r2)*r1); return { type:'mcq', question:'Ratio '+r1+':'+r2+'. Total = '+total+'. First share = ?', answer:String(share), options:shuffle([share,share+r1,share-r2>0?share-r2:share+r2,total-share].filter((v,i,a)=>v>0&&a.indexOf(v)===i).map(String).slice(0,4)) }; }

  // Default: emoji counting for KS1, written for KS2
  if(cfg.useEmoji){
    const emojis=['⭐','🍎','🐰','🦋','🐸','🌸','🎈','🍭','🚀','🎯'];
    const emoji=pick(emojis);
    const wrong=shuffle([n-sp,n+sp,n+sp*2,n-sp*2].filter(x=>x>0&&x!==n)).slice(0,3);
    return { type:'count', question:'How many '+emoji+'s can you see?', emoji, count:n, options:shuffle([n,...wrong]) };
  } else {
    // KS2: written number recognition / place value
    const wrong=shuffle([n-sp*10,n-sp,n+sp,n+sp*10].filter(x=>x>0&&x!==n)).slice(0,3);
    return { type:'mcq', question:'Which number is '+sp*10+' more than '+(n-sp*10)+'?', answer:String(n), options:shuffle([n,...wrong].map(String)) };
  }
}

// ── COMPARISON ────────────────────────────────────────────────
function makeComparisonQ(cfg, lvl){
  const [rangeMin, rangeMax] = cfg.ranges[lvl];
  let a=rnd(rangeMin,rangeMax), b=rnd(rangeMin,rangeMax);
  while(a===b) b=rnd(rangeMin,rangeMax);
  const correct = a>b?'left':b>a?'right':'equal';

  // Y1 uses language; others use numbers
  if(cfg.language){
    return { type:'compare', question:'Which number has MORE?', numA:a, numB:b, correctSide:correct };
  }
  return { type:'compare', question:'Which number is bigger?', numA:a, numB:b, correctSide:correct };
}

// ── PATTERNS ──────────────────────────────────────────────────
function makePatternsQ(cfg, lvl){
  const steps     = cfg.steps[lvl];
  const [sMin,sMax] = cfg.startRange[lvl];
  const step      = pick(steps);
  const isDecimal = typeof step === 'number' && step < 1;
  const start     = isDecimal ? Math.round(rnd(sMin*100,sMax*100))/100 : rnd(Math.max(sMin,1),Math.max(sMax,sMin+step*2));
  const len       = lvl>=3 ? 5 : 4;

  // Build sequence
  const seq = [];
  for(let i=0;i<=len;i++){
    const val = isDecimal ? Math.round((start+step*i)*1000)/1000 : start+step*i;
    seq.push(val);
  }
  const ans  = seq[seq.length-1];
  // Compute decPlaces FIRST so it's available for wrong option rounding
  const decPlaces = isDecimal ? Math.max(1, (String(step).split('.')[1]||'').length) : 0;
  const disp = seq.slice(0,-1).map(v=>isDecimal?parseFloat(v.toFixed(decPlaces)).toString():String(v)).concat(['?']);
  // Round wrong options at source AND via toFixed to eliminate ALL float noise
  const _r = (v) => isDecimal ? parseFloat(v.toFixed(decPlaces || 2)) : v;
  const wrong= shuffle([
    _r(isDecimal ? Math.round((ans-step)*1e10)/1e10 : ans-step),
    _r(isDecimal ? Math.round((ans+step)*1e10)/1e10 : ans+step),
    _r(isDecimal ? Math.round((ans+step*2)*1e10)/1e10 : ans+step*2),
    _r(isDecimal ? Math.round((ans-step*2)*1e10)/1e10 : ans-step*2)
  ].filter(x=>x!==ans&&x>0)).slice(0,3);

  // decPlaces already computed above
  const fmt = (v) => isDecimal ? parseFloat(v.toFixed(decPlaces)) : v;
  const fmtAns = fmt(ans);
  const fmtOpts = shuffle([fmtAns, ...wrong.map(fmt)]);
  return {
    type:'sequence',
    question:'What comes next in this sequence?',
    seqValues:disp,
    seqAnswer:fmtAns,
    options:fmtOpts
  };
}

// ── ARITHMETIC ────────────────────────────────────────────────
function makeArithmeticQ(cfg, lvl){
  const ops    = cfg.ops[lvl];
  const maxVal = cfg.maxVal[lvl];
  const op     = pick(ops);
  let a,b,ans,q,wrong;

  // Number bond operations
  if(op==='+bond10'){ a=rnd(1,9); b=10-a; ans=10; q=a+' + '+b+' = ?'; }
  else if(op==='-bond10'){ a=10; b=rnd(1,9); ans=a-b; q=a+' − '+b+' = ?'; }
  else if(op==='+'){ a=rnd(1,maxVal); b=rnd(1,Math.max(1,maxVal-a)); ans=a+b; q=a+' + '+b+' = ?'; }
  else if(op==='-'){ a=rnd(2,maxVal); b=rnd(1,a-1); ans=a-b; q=a+' − '+b+' = ?'; }
  else if(op==='+3d'){ a=rnd(100,Math.min(maxVal,699)); b=rnd(100,Math.min(maxVal-a,300)); ans=a+b; q=a+' + '+b+' = ?'; }
  else if(op==='-3d'){ a=rnd(200,maxVal); b=rnd(100,a-1); ans=a-b; q=a+' − '+b+' = ?'; }

  // Times tables — specific tables per year
  else if(op.startsWith('×')&&op.length>1&&!isNaN(op.slice(1))){
    const t=parseInt(op.slice(1)); b=rnd(1,12); ans=t*b; q=t+' × '+b+' = ?';
  }
  else if(op.startsWith('÷')&&op.length>1&&!isNaN(op.slice(1))){
    const t=parseInt(op.slice(1)); b=rnd(1,12); a=t*b; ans=b; q=a+' ÷ '+t+' = ?';
  }

  // Powers of 10
  else if(op==='×10')  { a=rnd(2,99);  ans=a*10;    q=a+' × 10 = ?'; }
  else if(op==='×100') { a=rnd(2,99);  ans=a*100;   q=a+' × 100 = ?'; }
  else if(op==='×1000'){ a=rnd(2,999); ans=a*1000;  q=a+' × 1,000 = ?'; }
  else if(op==='÷10')  { a=rnd(2,99)*10;  ans=a/10;   q=a+' ÷ 10 = ?'; }
  else if(op==='÷100') { a=rnd(2,99)*100; ans=a/100;  q=a+' ÷ 100 = ?'; }
  else if(op==='÷1000'){ a=rnd(2,9)*1000; ans=a/1000; q=a.toLocaleString()+' ÷ 1,000 = ?'; }

  // Factors
  else if(op==='factor'){
    const nums=[12,15,18,20,24,30,36,40,48];
    const n=pick(nums);
    const factors=Array.from({length:n},(_,i)=>i+1).filter(i=>n%i===0);
    const nonFactor=[n+3,n+5,n+7,n+11].find(x=>n%x!==0)||n+13;
    ans=String(nonFactor);
    return { type:'mcq', question:'Which is NOT a factor of '+n+'?', answer:ans,
      options:shuffle([factors[1],factors[2]||factors[0]+1,nonFactor,factors[factors.length-2]||factors[0]+3].map(String)) };
  }

  // Percentages
  else if(op==='pct10') { const w=pick([20,30,40,50,60,80,100,120,200]); ans=w/10;  q='10% of '+w+' = ?'; }
  else if(op==='pct25') { const w=pick([20,40,60,80,100,120,200,400]);   ans=w/4;   q='25% of '+w+' = ?'; }
  else if(op==='pct50') { const w=pick([18,24,30,40,50,60,80,100,200]);  ans=w/2;   q='50% of '+w+' = ?'; }
  else if(op==='pct75') { const w=pick([20,40,60,80,100,120,200]);       ans=w*3/4; q='75% of '+w+' = ?'; }

  // Ratio
  else if(op==='ratio'){
    const r1=rnd(1,4); const r2=rnd(1,4); const t=(r1+r2)*rnd(2,6);
    const share=Math.round(t/(r1+r2)*r1);
    return { type:'mcq', question:'Ratio '+r1+':'+r2+'. Total = '+t+'. First share?', answer:String(share),
      options:shuffle([share,share+r1,share+r2,t-share].filter((v,i,ar)=>v>0&&ar.indexOf(v)===i).map(String).slice(0,4)) };
  }

  // Algebra
  else if(op==='algebra'){
    const coeff=rnd(2,9); const n=rnd(2,9); const c=rnd(1,9); const result=coeff*n+c;
    return { type:'mcq', question:coeff+'n + '+c+' = '+result+'. Find n.', answer:String(n),
      options:shuffle([n,n+1,n-1,n+2].map(String)) };
  }

  // Long division
  else if(op==='longdiv'){
    const d=pick([6,7,8,9,11,12]); const q2=rnd(10,99); a=d*q2; ans=q2;
    q=a+' ÷ '+d+' = ? 📝';
  }

  // BODMAS
  else if(op==='bodmas'){
    const x=rnd(2,8); const y=rnd(2,6); const z=rnd(1,5);
    ans=x*y+z; q=x+' × '+y+' + '+z+' = ? 📝';
  }

  // Fallback
  else { a=rnd(1,20); b=rnd(1,10); ans=a+b; q=a+' + '+b+' = ?'; }

  // Generate distractors — always produce 4 unique positive options
  const ansNum = Number(ans);
  const sp = lvl<=1?3:lvl<=3?2:1;
  const candidates = [ansNum+sp,ansNum-sp,ansNum+sp*2,ansNum-sp*2,ansNum+1,ansNum-1,ansNum+sp*3,ansNum+sp*4];
  return { type:'mcq', question:q, answer:String(ans), options:uniqueOpts(String(ans),candidates.filter(x=>x>0&&String(x)!==String(ans)).map(String),true) };
}

// ── RHYTHM ────────────────────────────────────────────────────
function makeRhythmQ(cfg, lvl){
  // cfg.music.patternLen is indexed by level — matches year group complexity
  const padKeys = ['g','p','a','c'];
  const patLen  = (cfg && cfg.music && cfg.music.patternLen)
    ? cfg.music.patternLen[Math.min(lvl,5)]
    : (level<=1?3:level<=2?4:level<=3?5:level<=4?6:8);
  const pattern = Array.from({length:patLen},()=>pick(padKeys));
  const yearLabel = year ? ' · '+year : '';
  return { type:'rhythm', question:'Tap the pads to match the pattern!'+yearLabel, pattern };
}

function makeMelodyQ(cfg, lvl){
  // cfg.music.melodyLen is indexed by level — matches year group complexity
  const notes  = Object.keys(NOTE_FREQS);
  const seqLen = (cfg && cfg.music && cfg.music.melodyLen)
    ? cfg.music.melodyLen[Math.min(lvl,5)]
    : (level<=1?2:level<=2?3:level<=3?4:level<=4?5:6);
  const seq = Array.from({length:seqLen},()=>pick(notes));
  const yearLabel = year ? ' · '+year : '';
  return { type:'melody', question:'Listen then play the melody back!'+yearLabel, melSeq:seq };
}

// ── BEAT COUNT ──────────────────────────────────────────────
function makeBeatCountQ(cfg, lvl){
  // Scale beat count with level: lower levels get fewer beats
  const minBeats = [2, 2, 3, 3, 4, 5][Math.min(lvl, 5)];
  const maxBeats = [4, 5, 6, 8, 10, 14][Math.min(lvl, 5)];
  const count = rnd(minBeats, maxBeats);
  const yearLabel = year ? ' · ' + year : '';
  return { type: 'beatcount', question: 'Listen carefully — how many beats do you hear?' + yearLabel, beatCount: count };
}

// ══════════════════════════════════════
//  QUESTION RENDER
// ══════════════════════════════════════
function nextQuestion(){
  if(qIndex >= sessionTarget){ showComplete(); return; }

  // Always clear UI first so child never sees stale content
  const visual   = document.getElementById('questionVisual');
  const answers  = document.getElementById('answersArea');
  const qText    = document.getElementById('questionText');
  const feedback = document.getElementById('feedback');
  visual.innerHTML=''; answers.innerHTML='';
  feedback.textContent=''; feedback.className='feedback';
  answers.className='answers';
  document.getElementById('qNumberText').textContent = 'Question '+(qIndex+1)+' of '+sessionTarget;
  document.getElementById('qProgressFill').style.width = (qIndex/sessionTarget*100)+'%';

  let q;
  try {
    q = makeQuestion();
  } catch(err) {
    // makeQuestion failed — use a guaranteed safe fallback question
    console.warn('makeQuestion error:', err);
    q = safeFallbackQuestion();
  }

  // Final safety net — if q is still broken, use fallback
  if(!q || !q.type || !q.question) q = safeFallbackQuestion();

  qText.textContent = q.question.replace(' 📝','');
  questionStartTime = Date.now();
  // Show written working hint for long division and BODMAS
  const workHint = document.getElementById('workingHint');
  if(workHint) workHint.style.display = q.question.includes('📝') ? 'block' : 'none';

  // Re-animate card
  const card = document.getElementById('qCard');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';

  // Clear any previous skip button + timer
  const oldSkip = document.getElementById('skipBtn');
  if(oldSkip) oldSkip.remove();
  if(window._skipTimer) { clearTimeout(window._skipTimer); window._skipTimer = null; }

  try {
    switch(q.type){
      case 'count':    renderCount(q, visual, answers);    break;
      case 'compare':  renderCompare(q, visual, answers);  break;
      case 'sequence': renderSequence(q, visual, answers); break;
      case 'mcq':      renderMCQ(q, answers);              break;
      case 'fraction': renderFraction(q, visual, answers); break;
      case 'rhythm':    renderRhythm(q, answers);          break;
      case 'melody':    renderMelody(q, answers);          break;
      case 'beatcount': renderBeatCount(q, answers);       break;
      default:         renderMCQ(safeFallbackQuestion(), answers); break;
    }
  } catch(renderErr) {
    console.warn('render error:', renderErr);
    answers.innerHTML='';
    answers.className='answers two-col';
    const fallback = safeFallbackQuestion();
    qText.textContent = fallback.question;
    fallback.options.forEach(opt=>{
      const btn=makeAnsBtn(opt,()=>checkAns(String(opt)===String(fallback.answer),answers));
      answers.appendChild(btn);
    });
  }

  // Show skip button after 8s for eligible question types (not music, not counting)
  const _skipEligible = ['mcq','sequence','compare','fraction'].includes(q.type);
  if(_skipEligible){
    window._skipTimer = setTimeout(()=>{
      // Only add if question hasn't been answered yet
      if(document.getElementById('skipBtn')) return;
      const skipBtn = document.createElement('button');
      skipBtn.id = 'skipBtn';
      skipBtn.style.cssText = [
        'position:absolute','bottom:12px','right:12px',
        'background:rgba(136,135,128,0.12)','border:1px solid rgba(136,135,128,0.25)',
        'color:var(--gray-400)','font-size:11px','font-weight:700',
        'padding:6px 14px','border-radius:20px','cursor:pointer',
        'font-family:Quicksand,sans-serif','opacity:0',
        'transition:opacity .6s ease'
      ].join(';');
      skipBtn.textContent = 'Skip this question →';
      skipBtn.setAttribute('aria-label', 'Skip this question');
      skipBtn.onclick = () => skipQuestion(answers);
      // Insert into the question card
      const card = document.getElementById('qCard');
      if(card){
        card.style.position = 'relative';
        card.appendChild(skipBtn);
        // Fade in
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ skipBtn.style.opacity='1'; }));
      }
    }, 8000);
  }
}

// ── Safe fallback question — always works, no config needed ──
function skipQuestion(answersEl){
  // Disable all answer buttons
  if(answersEl) answersEl.querySelectorAll('.ans-btn,.cmp-btn,.levelup-btn').forEach(b=>{ b.onclick=null; b.style.opacity='0.4'; });
  // Remove skip button
  const sb = document.getElementById('skipBtn');
  if(sb) sb.remove();
  if(window._skipTimer){ clearTimeout(window._skipTimer); window._skipTimer=null; }

  skipsUsed++;

  // Show gentle message to child
  const fb = document.getElementById('feedback');
  if(fb){ fb.textContent = "That's okay! Let's try the next one 🦊"; fb.className='feedback pip'; }
  pipSay("No worries! Next one 🦊", 2000);
  pipAnimate('wave', 800);

  // Count as incorrect for scoring (affects adaptive difficulty)
  onAnswer(false);
}

function safeFallbackQuestion(){
  const a=rnd(1,10); const b=rnd(1,10); const ans=a+b;
  const wrong=shuffle([ans+1,ans-1,ans+2].filter(x=>x>0&&x!==ans)).slice(0,3);
  return { type:'mcq', question:a+' + '+b+' = ?', answer:String(ans),
    options:shuffle([ans,...wrong].map(String)) };
}

function renderCount(q, visual, answers){
  const grid = document.createElement('div');
  grid.className='emoji-display';
  for(let i=0;i<q.count;i++){
    const s=document.createElement('span');s.textContent=q.emoji;s.setAttribute('aria-hidden','true');
    grid.appendChild(s);
  }
  visual.appendChild(grid);
  answers.className='answers two-col';
  q.options.forEach(opt=>{
    const btn=makeAnsBtn(opt, ()=>checkAns(opt===q.count, answers));
    answers.appendChild(btn);
  });
}

function renderCompare(q, visual, answers){
  const row=document.createElement('div');row.className='compare-display';
  const bigNum = Math.max(Math.abs(q.numA),Math.abs(q.numB))>=100;
  row.innerHTML=`<div class="num-box${bigNum?' big-num':''}" aria-label="Number ${q.numA}">${q.numA}</div>
    <div class="vs-text">or</div>
    <div class="num-box${bigNum?' big-num':''}" aria-label="Number ${q.numB}">${q.numB}</div>`;
  visual.appendChild(row);

  const btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:10px;justify-content:center;flex-wrap:wrap;';
  const btnA=document.createElement('button');btnA.className='cmp-btn';btnA.textContent=q.numA+' is bigger';
  const btnB=document.createElement('button');btnB.className='cmp-btn';btnB.textContent=q.numB+' is bigger';

  btnA.onclick=()=>{btnA.onclick=null;btnB.onclick=null;checkCompare('left',q.correctSide,btnA,btnB);};
  btnB.onclick=()=>{btnA.onclick=null;btnB.onclick=null;checkCompare('right',q.correctSide,btnB,btnA);};

  btnRow.appendChild(btnA);btnRow.appendChild(btnB);
  answers.appendChild(btnRow);
}

function renderSequence(q, visual, answers){
  const row=document.createElement('div');row.className='seq-display';
  q.seqValues.forEach(v=>{
    const box=document.createElement('div');
    box.className='seq-box'+(v==='?'?' unknown':'');
    box.textContent=v;row.appendChild(box);
  });
  visual.appendChild(row);
  answers.className='answers two-col';

  // Determine display precision from the sequence values themselves
  // This is the nuclear option — format at render time regardless of what makePatternsQ passed
  const allNums = [...q.options, q.seqAnswer].map(Number).filter(v=>!isNaN(v));
  const hasDecimal = allNums.some(v=>!Number.isInteger(v));
  const getDecPlaces = (v) => {
    const s = String(v);
    const dot = s.indexOf('.');
    return dot === -1 ? 0 : s.length - dot - 1;
  };
  // Use precision of the answer to determine display format
  const ansNum = parseFloat(String(q.seqAnswer));
  const ansStr = String(q.seqAnswer);
  const targetDp = hasDecimal ? Math.max(1, getDecPlaces(ansStr)) : 0;

  const cleanNum = (v) => {
    if(!hasDecimal) return String(v);
    const n = parseFloat(String(v));
    if(isNaN(n)) return String(v);
    // Round to targetDp to eliminate float noise
    return n.toFixed(targetDp);
  };

  const cleanAns = cleanNum(q.seqAnswer);

  q.options.forEach(opt=>{
    const displayOpt = cleanNum(opt);
    const btn=makeAnsBtn(displayOpt,()=>checkAns(displayOpt===cleanAns,answers));
    answers.appendChild(btn);
  });
}

async function playBcBeats(count,btn){
  if(btn){btn.disabled=true;btn.textContent='🥁 Playing...';}
  // Ensure audio is ready before scheduling beats
  try { await getAudio(); } catch(e){ console.warn('Audio init failed'); }
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      // Drum noise
      const ctx=audioCtx; if(!ctx||ctx.state!=='running') return;
      const bufSize=ctx.sampleRate*0.05;
      const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let j=0;j<bufSize;j++) data[j]=(Math.random()*2-1)*Math.pow(1-j/bufSize,3);
      const src=ctx.createBufferSource();src.buffer=buf;
      const g2=ctx.createGain();g2.gain.setValueAtTime(0.8,ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
      src.connect(g2);g2.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.1);
      playTone(80,'sine',0.12,0.5);
      haptic([50]); // feel each beat
      // Light up dot
      const dot=document.getElementById('pbc-'+i);
      if(dot){
        dot.style.background='var(--green)';dot.style.borderColor='var(--green-dark)';dot.style.transform='scale(1.3)';
        setTimeout(()=>{dot.style.background='var(--gray-100)';dot.style.borderColor='var(--gray-200)';dot.style.transform='scale(1)';},220);
      }
    },i*480);
  }
  setTimeout(()=>{if(btn){btn.disabled=false;btn.textContent='🥁 Hear again';}},count*480+400);
}

function tapPad(k,pad){

function makeAnsBtn(val, handler){
  const btn=document.createElement('button');
  btn.className='ans-btn';btn.textContent=val;
  btn.setAttribute('aria-label','Answer: '+val);
  btn.onclick=()=>{ unlockAudio(); handler(); };return btn;
}

function checkAns(isCorrect, answersEl){
  // Disable all buttons
  answersEl.querySelectorAll('.ans-btn').forEach(b=>b.onclick=null);
  onAnswer(isCorrect);
}

function checkCompare(chosen, correct, chosenBtn, otherBtn){
  chosenBtn.onclick=null;otherBtn.onclick=null;
  onAnswer(chosen===correct||correct==='equal');
  if(chosen===correct||correct==='equal') chosenBtn.classList.add('correct');
  else chosenBtn.classList.add('wrong');
}

function onAnswer(isCorrect){
  const fb = document.getElementById('feedback');
  totalQ++;
  qIndex++;

  // Freemium: show sponsor ad every 3 questions
  const _continueAnswer = () => _onAnswerContinue(isCorrect, fb);
  if (!NF.isPro() && NF.isFreemium() && totalQ > 0 && totalQ % 3 === 0) {
    NF.showSponsorAd(_continueAnswer);
    return;
  }
  _continueAnswer();
}

function _onAnswerContinue(isCorrect, fb) {

  if(isCorrect){
    score++; streak++; if(streak>bestStreak) bestStreak=streak;
    playCorrect();
    pipAnimate('happy',700);

    // Star every 3 correct
    if(score>0 && score%3===0){
      starsEarned++;
      renderStars();
      haptic([40,30,40,30,80]); // star earned pulse
      floatEmoji('⭐', 120, window.innerHeight-200);
      pipSay(pick(["⭐ A star! 🦊","Stars for you! ✨","Woohoo! ⭐"]),2000);
      if(starsEarned%3===0){
        pipAnimate('celebrate',900);
        pipSay("You're amazing! 🎉",2500);
      }
    }

    // Pip says something encouraging
    const goodPhrases=["Great job! 🌟","You got it! 🎉","Brilliant! ✨","Spot on! 🦊","Wow! 🌈","Perfect! 💫","Yes!! ⭐","You're so clever! 🧠","Keep going! 💪","Amazing! 🎊"];
    fb.textContent=pick(goodPhrases);fb.className='feedback good';

    // Float reward
    floatEmoji(['🌟','✨','⭐','💫','🎉'][Math.floor(Math.random()*5)],
      rnd(80,window.innerWidth-80), rnd(200,window.innerHeight-200));

    // Level up check
    if(streak>0 && streak%levelUpThreshold===0 && level<5){
      setTimeout(showLevelUp,800);
    } else {
      setTimeout(nextQuestion,900);
    }

  } else {
    streak=0;
    playWrong();
    pipAnimate('sad',800);
    document.getElementById('pipMouthHappy').setAttribute('opacity','0');
    document.getElementById('pipMouthSad').setAttribute('opacity','1');
    setTimeout(()=>{
      document.getElementById('pipMouthHappy').setAttribute('opacity','1');
      document.getElementById('pipMouthSad').setAttribute('opacity','0');
    },900);

    const badPhrases=["Almost! Try next one 😊","Good try! 🦊","Keep going! 💪","Nearly there! 🌟","Don't worry, keep trying! 🎈"];
    fb.textContent=pick(badPhrases);fb.className='feedback bad';
    pipSay(pick(["Nearly! Try again 🦊","Keep going! 💪","You'll get it! ⭐"]),2000);
    setTimeout(nextQuestion,1100);
  }

  updateScoreDisplay();
}  // end _onAnswerContinue

  document.getElementById('statAnswered').textContent=qIndex;
  // Show skip count if any were used
  const skipStatEl = document.getElementById('statSkips');
  const skipRowEl = document.getElementById('skipStatRow');
  if(skipStatEl) skipStatEl.textContent = skipsUsed;
  if(skipRowEl) skipRowEl.style.display = skipsUsed > 0 ? 'flex' : 'none';
  document.getElementById('statCorrectCount').textContent=score;
  document.getElementById('statStarsEarned').textContent=starsEarned;
  document.getElementById('statStreakBest').textContent=bestStreak;

  const pct=Math.round(score/Math.max(qIndex,1)*100);
  document.getElementById('completeTitle').textContent=pct>=80?'Amazing work!':pct>=60?'Great effort!':'Good try!';
  document.getElementById('completeEmoji').textContent=pct>=80?'🏆':pct>=60?'🌟':'💪';
  document.getElementById('completeSub').textContent=score+' correct out of '+qIndex+' ('+pct+'%)';

  document.getElementById('completeOverlay').classList.add('show');
  saveProgress();
}

function playAgain(){
  document.getElementById('completeOverlay').classList.remove('show');
  qIndex=0;score=0;totalQ=0;streak=0;bestStreak=0;starsEarned=0;skipsUsed=0;
  // Re-apply freemium cap
  if (!NF.isPro() && NF.isFreemium()) sessionTarget = FREEMIUM_Q_CAP;
  renderStars();
  updateScoreDisplay();
  nextQuestion();
}

function goBack(){
  // Go back to the game tiles — skip code re-entry by passing a flag
  // join.html checks sessionStorage and skips to play area if already authenticated
  sessionStorage.setItem('nf_already_auth','1');
  window.location.href='join.html';
}

// ══════════════════════════════════════
//  SAVE PROGRESS TO LOCALSTORAGE
// ══════════════════════════════════════
function saveProgress(){
  const assessment = getLS('nf_assessment') || {};
  if(!assessment.skills) assessment.skills={};

  // Update skill score based on performance
  const skillMap={counting:'counting',comparison:'comparison',patterns:'patterns',arithmetic:'arithmetic',music:'rhythm'};
  const key=skillMap[gameType]||gameType;
  const pct=Math.round(score/Math.max(qIndex,1)*100);
  // Blend old score with new performance (70/30 weighting)
  const oldScore=assessment.skills[key]||50;
  assessment.skills[key]=Math.round(oldScore*0.7+pct*0.3);
  assessment.sessions=(assessment.sessions||0)+1;
  assessment.lastPlayed=Date.now();

  // Update level for this skill
  if(!assessment.levels) assessment.levels={};
  assessment.levels[key]=level;

  // Update activity log
  if(!assessment.activities) assessment.activities=[];
  const gameNames={counting:'Counting games',comparison:'Number comparison',patterns:'Pattern games',arithmetic:'Arithmetic',music:'Music therapy'};
  const gameBgs={counting:'var(--green-light)',comparison:'var(--amber-light)',patterns:'var(--purple-light)',arithmetic:'var(--coral-light)',music:'var(--purple-light)'};
  assessment.activities.unshift({
    icon:{counting:'🔢',comparison:'⚖️',patterns:'🧩',arithmetic:'➕',music:'🎵'}[gameType]||'🎮',
    bg:gameBgs[gameType]||'var(--gray-100)',
    name:gameNames[gameType]||gameType,
    time:'Today · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · '+Math.ceil(qIndex*0.4)+'min',
    score:pct+'%',
    sc:{counting:'var(--green-dark)',comparison:'var(--amber-dark)',patterns:'var(--purple-dark)',arithmetic:'var(--coral-dark)',music:'var(--purple-dark)'}[gameType]||'var(--gray-600)'
  });
  assessment.activities=assessment.activities.slice(0,10); // keep last 10

  setLS('nf_assessment',assessment);

  // Sync to Supabase in background — get active child index
  try {
    const activeIdx = parseInt(localStorage.getItem('nf_active_child') || '0', 10);
    NF.saveAssessmentToSupabase(activeIdx, assessment).catch(e =>
      console.warn('Play session Supabase sync failed (non-critical):', e)
    );
  } catch(e) {}
}

// ══════════════════════════════════════
//  PIP THE FOX
// ══════════════════════════════════════
const pip=document.getElementById('pip');
const pipBubble=document.getElementById('pipBubble');
let pipBubbleTimer=null,pipStateTimer=null;

function pipSay(text,dur=3000){
  clearTimeout(pipBubbleTimer);
  pipBubble.textContent=text;pipBubble.classList.remove('hidden');
  if(dur>0) pipBubbleTimer=setTimeout(()=>pipBubble.classList.add('hidden'),dur);
}

function pipAnimate(state,dur=800){
  clearTimeout(pipStateTimer);
  pip.className='pip-wrap '+state;
  const mH=document.getElementById('pipMouthHappy');
  const mS=document.getElementById('pipMouthSad');
  if(state==='sad'){mH.setAttribute('opacity','0');mS.setAttribute('opacity','1');}
  else{mH.setAttribute('opacity','1');mS.setAttribute('opacity','0');}
  pipStateTimer=setTimeout(()=>{pip.className='pip-wrap';mH.setAttribute('opacity','1');mS.setAttribute('opacity','0');},dur);
}

function pipTap(){ unlockAudio();
  pipAnimate('happy',700);
  pipSay(pick(["Hehe! 😄","Pip says hi! 🦊","Keep going! ⭐","You're doing great! 🌟","Almost there! 💪"]),2000);
}

// Periodic encouragement
setInterval(()=>{
  if(!document.getElementById('levelUpOverlay').classList.contains('show')&&
     !document.getElementById('completeOverlay').classList.contains('show')&&
     pipBubble.classList.contains('hidden')){
    pipSay(pick(["You're doing great! 🌟","Pip believes in you! 🦊","Keep it up! 💪","You're so clever! 🧠","Amazing work! ✨"]),2500);
  }
},15000);

// ══════════════════════════════════════
//  FLOATING REWARD EMOJIS
// ══════════════════════════════════════
function floatEmoji(emoji,x,y){
  const el=document.createElement('div');
  el.className='float-reward';
  el.textContent=emoji;
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}
