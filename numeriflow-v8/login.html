<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sign in to your NumeriFlow account.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D9E75">
<link rel="canonical" href="https://numeriflow.uk/login">
<title>Sign In — NumeriFlow</title>
<link rel="stylesheet" href="style.css">
<script src="nf-core.js"></script>
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gray-50);padding:32px 16px}
.login-card{background:var(--white);border-radius:var(--radius-xl);border:1px solid var(--gray-100);box-shadow:var(--shadow-lg);padding:40px;width:100%;max-width:420px}
.login-header{text-align:center;margin-bottom:28px}
.back-home{display:block;text-align:center;font-size:13px;color:var(--gray-400);margin-top:20px;text-decoration:none}
.back-home:hover{color:var(--green)}
.error-message{display:none;background:var(--coral-light);color:var(--coral-dark);border-radius:var(--radius-md);padding:10px 14px;font-size:13px;font-weight:600;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="login-card">
    <div class="login-header">
      <a href="index.html" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-bottom:16px">
        <img src="logo.png" alt="NumeriFlow" style="height:52px;width:auto;">
      </a>
      <div style="font-size:18px;font-weight:700;color:var(--gray-900);margin-bottom:6px">Welcome back</div>
      <div style="font-size:14px;color:var(--gray-400)">Sign in to your NumeriFlow account</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="emailInput">Email address</label>
      <input class="form-input" type="email" id="emailInput" placeholder="sarah@example.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="passInput">Password</label>
      <input class="form-input" type="password" id="passInput" placeholder="Your password" autocomplete="current-password" required>
    </div>

    <div class="error-message" id="loginError"></div>

    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="doLogin()" id="loginBtn">
      Sign in →
    </button>

    <div style="text-align:center;font-size:13px;color:var(--gray-400);margin-top:20px">
      Don't have an account? <a href="signup.html" style="color:var(--green);font-weight:700">Create one free</a>
    </div>
    <a href="index.html" class="back-home">← Back to home</a>
  </div>
</div>

<script>
// Already logged in — go straight to dashboard
if (NF.getUser()) window.location.href = 'dashboard.html';

function doLogin() {
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const pass  = document.getElementById('passInput').value;
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');

  errEl.style.display = 'none';

  if (!email) { showErr('Please enter your email address.'); return; }
  if (!pass)  { showErr('Please enter your password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  // Only allow users who have actually registered on this device
  const allUsers = JSON.parse(localStorage.getItem('nf_all_users') || '[]');
  const found = allUsers.find(u => u.email === email);

  // Strict check — email must exist in registry
  if (!found) {
    showErr('No account found with this email address. <a href="signup.html" style="color:var(--green-dark);font-weight:700;">Create an account →</a>');
    return;
  }

  // Password must be at least 6 characters (no server-side hash — localStorage auth)
  if (pass.length < 6) {
    showErr('Incorrect password. Please try again.');
    return;
  }

  // ── Clear previous user's data before loading this session ──────────
  // This prevents child names / assessment data from a different account
  // appearing in the dashboard when switching between users on same device
  const keysToPreserve = ['nf_all_users'];
  const preserved = {};
  keysToPreserve.forEach(k => {
    const v = localStorage.getItem(k);
    if (v) preserved[k] = v;
  });
  localStorage.clear();
  keysToPreserve.forEach(k => {
    if (preserved[k]) localStorage.setItem(k, preserved[k]);
  });

  // Restore this user's session
  const userData = {
    name:        found.name,
    email:       found.email,
    role:        found.role  || 'parent',
    plan:        found.plan  || 'free',
    signupDate:  found.signupDate,
    id:          found.id || 'u_' + Date.now(),
    emailVerified: found.emailVerified || false,
  };
  NF.setUser(userData);
  redirect();
}

function redirect() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next') || 'dashboard.html';
  window.location.href = next;
}

function showErr(msg) {
  const el = document.getElementById('loginError');
  el.innerHTML = msg;
  el.style.display = 'block';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = 'Sign in →';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
