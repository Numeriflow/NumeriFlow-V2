<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56;
  --purple: #7F77DD; --purple-light: #EEEDFE; --purple-dark: #534AB7;
  --amber: #EF9F27; --amber-light: #FAEEDA; --amber-dark: #854F0B;
  --coral: #D85A30; --coral-light: #FAECE7; --coral-dark: #993C1D;
  --fox-body: #F4793B; --fox-belly: #FDE8D8; --fox-dark: #C85A1E;
  --white: #FFFFFF; --gray-50: #F8F7F4; --gray-100: #F0EEE9;
  --gray-200: #D3D1C7; --gray-400: #888780; --gray-900: #2C2C2A;
}

html { font-size: 16px; }

body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(160deg, #FFF3E0 0%, #E8F5E9 40%, #EDE7F6 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 16px 120px;
  overflow-x: hidden;
  position: relative;
}

/* ── Animated background clouds ── */
.bg-cloud {
  position: fixed;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
  filter: blur(2px);
  z-index: 0;
  animation: drift linear infinite;
}
@keyframes drift {
  from { transform: translateX(-200px); }
  to   { transform: translateX(110vw); }
}

/* ── Card ── */
.card {
  background: var(--white);
  border-radius: 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.10), 0 6px 16px rgba(0,0,0,0.06);
  padding: 36px 32px 28px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 2;
  animation: popIn 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn { from{opacity:0;transform:scale(0.8) translateY(24px)} to{opacity:1;transform:scale(1) translateY(0)} }

.logo {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800; font-size: 20px;
  color: var(--gray-900); text-decoration: none;
  display: block; text-align: center; margin-bottom: 20px;
}
.logo span { color: var(--green); }

/* ── States ── */
.state { display: none; }
.state.active { display: block; animation: fadeSlideUp 0.35s ease both; }
@keyframes fadeSlideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── Code entry ── */
.enter-heading {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800; font-size: 26px;
  color: var(--gray-900); text-align: center; margin-bottom: 6px;
}

.enter-sub {
  font-size: 14px; color: var(--gray-400);
  text-align: center; line-height: 1.6; margin-bottom: 24px;
}

.code-row {
  display: flex; gap: 7px;
  justify-content: center; margin-bottom: 20px;
}

.code-box {
  width: 50px; height: 62px;
  border-radius: 14px;
  border: 2.5px solid var(--gray-200);
  background: var(--gray-50);
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800; font-size: 28px;
  color: var(--gray-900); text-align: center;
  outline: none; transition: all 0.15s;
  -moz-appearance: textfield;
}
.code-box::-webkit-outer-spin-button,
.code-box::-webkit-inner-spin-button { -webkit-appearance: none; }
.code-box:focus {
  border-color: var(--green);
  background: var(--green-light);
  box-shadow: 0 0 0 3px rgba(29,158,117,0.18);
  transform: scale(1.08);
}
.code-box.filled { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
.code-box.error  { border-color: var(--coral); background: var(--coral-light); animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

.error-msg {
  font-size: 13px; font-weight: 700; color: var(--coral-dark);
  text-align: center; margin-bottom: 14px; min-height: 18px; display: none;
}
.error-msg.show { display: block; animation: fadeSlideUp 0.2s ease; }

.play-btn {
  width: 100%; padding: 16px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--green), #16785A);
  color: var(--white); border: none;
  font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 6px 20px rgba(29,158,117,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.play-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(29,158,117,0.42); }
.play-btn:active { transform: scale(0.97); }
.play-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* ── Play area ── */
.child-greeting {
  font-family: 'Baloo 2', sans-serif; font-weight: 800;
  font-size: 28px; color: var(--gray-900);
  text-align: center; margin-bottom: 4px;
}
.child-sub { font-size: 14px; color: var(--gray-400); text-align: center; margin-bottom: 20px; line-height: 1.5; }

/* Stars */
.stars-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
.star-item { font-size: 22px; }
.star-item.earned { animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes starPop { 0%{transform:scale(0) rotate(-30deg)} 100%{transform:scale(1) rotate(0)} }

/* Game tiles */
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.game-tile {
  border-radius: 20px; padding: 18px 12px;
  text-align: center; cursor: pointer;
  border: none; transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.10);
  position: relative;
}
.game-tile:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 24px rgba(0,0,0,0.14); }
.game-tile:active { transform: scale(0.97); }

.game-tile-emoji { font-size: 36px; margin-bottom: 8px; display: block; }
.game-tile-name {
  font-family: 'Baloo 2', sans-serif; font-weight: 800;
  font-size: 14px; color: var(--white); line-height: 1.2;
}
.game-tile-sub { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 3px; font-weight: 700; }

.tile-counting { background: linear-gradient(135deg, #1D9E75, #0C6647); }
.tile-compare  { background: linear-gradient(135deg, #EF9F27, #B87616); }
.tile-patterns { background: linear-gradient(135deg, #7F77DD, #4A44A8); }
.tile-music    { background: linear-gradient(135deg, #EC407A, #A01050); }

.skill-check-btn {
  width: 100%; padding: 13px;
  border-radius: 16px;
  background: var(--purple-light);
  color: var(--purple-dark);
  border: 2px solid var(--purple);
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800; font-size: 16px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 14px;
}
.skill-check-btn:hover { background: var(--purple); color: var(--white); transform: translateY(-2px); }

.footer-note { font-size: 11px; color: var(--gray-400); text-align: center; line-height: 1.5; }
.footer-note a { color: var(--green); font-weight: 700; text-decoration: none; }

/* ── Loading ── */
.loading-state { text-align: center; padding: 48px 0; }
.loading-emoji { font-size: 52px; animation: spinBounce 1s ease-in-out infinite; display: block; margin-bottom: 16px; }
@keyframes spinBounce { 0%,100%{transform:scale(1) rotate(0)} 50%{transform:scale(1.2) rotate(10deg)} }
.loading-text { font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; color:var(--gray-900); }

/* ════════════════════════════════════════
   PIP THE FOX — fixed bottom right
════════════════════════════════════════ */
.pip-container {
  position: fixed;
  bottom: 0; right: 20px;
  width: 140px;
  z-index: 100;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.pip-container:hover .pip-body-group { animation: pipHover 0.4s ease; }
@keyframes pipHover { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* Ground strip */
.pip-ground {
  width: 140px; height: 14px;
  background: linear-gradient(90deg, #A8D5B5, #C5E8D0, #A8D5B5);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  margin: 0 auto;
}

/* Speech bubble */
.pip-bubble {
  position: absolute;
  bottom: 160px; right: 10px;
  background: var(--white);
  border-radius: 16px 16px 4px 16px;
  padding: 10px 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800; font-size: 13px;
  color: var(--gray-900);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  max-width: 160px; min-width: 100px;
  text-align: center; line-height: 1.4;
  transform-origin: bottom right;
  animation: bubbleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  border: 2px solid var(--gray-100);
  pointer-events: none;
}
@keyframes bubbleIn { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }

.pip-bubble.hidden { display: none; }

/* Pip states (CSS classes on pip-container) */

/* ── IDLE: gentle breathing ── */
.pip-container .pip-body-group {
  animation: pipBreath 3s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes pipBreath { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.96)} }

/* ── HAPPY: jump ── */
.pip-container.happy .pip-body-group {
  animation: pipJump 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes pipJump {
  0%   { transform: translateY(0) rotate(0); }
  30%  { transform: translateY(-28px) rotate(-8deg); }
  60%  { transform: translateY(-18px) rotate(6deg); }
  80%  { transform: translateY(-4px) rotate(-2deg); }
  100% { transform: translateY(0) rotate(0); }
}

/* ── CELEBRATE: spin + bounce ── */
.pip-container.celebrate .pip-body-group {
  animation: pipCelebrate 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes pipCelebrate {
  0%   { transform: translateY(0) scale(1) rotate(0); }
  25%  { transform: translateY(-32px) scale(1.1) rotate(-15deg); }
  50%  { transform: translateY(-40px) scale(1.15) rotate(15deg); }
  75%  { transform: translateY(-20px) scale(1.05) rotate(-8deg); }
  100% { transform: translateY(0) scale(1) rotate(0); }
}

/* ── SAD: shake ── */
.pip-container.sad .pip-body-group {
  animation: pipSad 0.5s ease;
}
@keyframes pipSad {
  0%,100% { transform: translateX(0) rotate(0); }
  20%     { transform: translateX(-5px) rotate(-5deg); }
  40%     { transform: translateX(5px) rotate(5deg); }
  60%     { transform: translateX(-4px) rotate(-3deg); }
  80%     { transform: translateX(4px) rotate(3deg); }
}

/* ── WAVE: greeting ── */
.pip-container.wave .pip-body-group {
  animation: pipWave 1s ease;
}
@keyframes pipWave {
  0%   { transform: translateY(0) rotate(0); }
  15%  { transform: translateY(-16px) rotate(-10deg); }
  30%  { transform: translateY(-20px) rotate(8deg); }
  45%  { transform: translateY(-16px) rotate(-10deg); }
  60%  { transform: translateY(-8px) rotate(5deg); }
  100% { transform: translateY(0) rotate(0); }
}

/* ── RUN: used during loading transitions ── */
.pip-container.run .pip-body-group {
  animation: pipRun 0.4s ease infinite;
}
@keyframes pipRun {
  0%,100% { transform: translateY(0) scaleX(1); }
  25%     { transform: translateY(-6px) scaleX(0.95); }
  75%     { transform: translateY(-6px) scaleX(1.05); }
}

/* Tail wag */
.pip-container .pip-tail {
  transform-origin: 15% 50%;
  animation: tailWag 1.2s ease-in-out infinite;
}
@keyframes tailWag {
  0%,100% { transform: rotate(0deg); }
  33%     { transform: rotate(18deg); }
  66%     { transform: rotate(-12deg); }
}

.pip-container.happy .pip-tail,
.pip-container.celebrate .pip-tail {
  animation: tailWagFast 0.3s ease-in-out infinite;
}
@keyframes tailWagFast {
  0%,100% { transform: rotate(0deg); }
  50%     { transform: rotate(25deg); }
}

/* Eyes blink */
.pip-eye-l, .pip-eye-r {
  animation: eyeBlink 4s ease-in-out infinite;
}
.pip-eye-r { animation-delay: 0.08s; }
@keyframes eyeBlink {
  0%,90%,100% { transform: scaleY(1); }
  95%         { transform: scaleY(0.1); }
}

/* Stars burst on celebrate */
.pip-stars {
  position: absolute;
  bottom: 140px; right: 0;
  width: 140px; height: 80px;
  pointer-events: none;
  display: none;
}
.pip-container.celebrate .pip-stars { display: block; }

.star-burst {
  position: absolute;
  font-size: 18px;
  animation: starBurst 0.8s ease both;
}
@keyframes starBurst {
  0%   { opacity: 1; transform: scale(0) translate(0,0); }
  60%  { opacity: 1; }
  100% { opacity: 0; transform: scale(1.2) var(--burst-dir); }
}

/* ── Responsive: smaller Pip on small screens ── */
@media (max-width: 480px) {
  .pip-container { width: 100px; right: 8px; }
  .pip-bubble { font-size: 11px; padding: 8px 10px; right: 4px; }
}
</style>
</head>
<body>

<!-- ── Background clouds ── -->
<div class="bg-cloud" style="width:80px;height:50px;top:15%;animation-duration:22s;animation-delay:-8s;"></div>
<div class="bg-cloud" style="width:120px;height:70px;top:35%;animation-duration:30s;animation-delay:-3s;"></div>
<div class="bg-cloud" style="width:60px;height:40px;top:60%;animation-duration:18s;animation-delay:-14s;"></div>
<div class="bg-cloud" style="width:100px;height:60px;top:75%;animation-duration:25s;animation-delay:-20s;"></div>

<!-- ════════════════════════════════
     PIP THE FOX
════════════════════════════════ -->
<div class="pip-container" id="pip" onclick="pipTap()" role="img" aria-label="Pip the fox, your learning companion">

  <!-- Speech bubble -->
  <div class="pip-bubble hidden" id="pipBubble" aria-live="polite"></div>

  <!-- Star burst (celebrate state) -->
  <div class="pip-stars" id="pipStars" aria-hidden="true">
    <span class="star-burst" style="left:20px;top:10px;--burst-dir:translate(-24px,-28px);animation-delay:0s;">⭐</span>
    <span class="star-burst" style="left:60px;top:0px;--burst-dir:translate(0px,-32px);animation-delay:0.05s;">✨</span>
    <span class="star-burst" style="left:100px;top:10px;--burst-dir:translate(24px,-28px);animation-delay:0.1s;">⭐</span>
    <span class="star-burst" style="left:10px;top:40px;--burst-dir:translate(-28px,-10px);animation-delay:0.08s;">✨</span>
    <span class="star-burst" style="left:115px;top:40px;--burst-dir:translate(28px,-10px);animation-delay:0.12s;">⭐</span>
  </div>

  <!-- Pip SVG — drawn in pure SVG, no images -->
  <svg class="pip-body-group" width="140" height="150" viewBox="0 0 140 150" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <!-- TAIL -->
    <g class="pip-tail">
      <ellipse cx="28" cy="118" rx="22" ry="11" fill="#F4793B" transform="rotate(-30 28 118)"/>
      <ellipse cx="18" cy="108" rx="10" ry="6" fill="#FDE8D8" transform="rotate(-30 18 108)"/>
    </g>

    <!-- BODY -->
    <ellipse cx="70" cy="112" rx="36" ry="32" fill="#F4793B"/>
    <!-- Belly -->
    <ellipse cx="70" cy="118" rx="22" ry="20" fill="#FDE8D8"/>

    <!-- LEFT LEG -->
    <rect x="46" y="134" width="16" height="20" rx="8" fill="#C85A1E"/>
    <!-- LEFT PAW -->
    <ellipse cx="54" cy="154" rx="10" ry="6" fill="#C85A1E"/>

    <!-- RIGHT LEG -->
    <rect x="80" y="134" width="16" height="20" rx="8" fill="#C85A1E"/>
    <!-- RIGHT PAW -->
    <ellipse cx="88" cy="154" rx="10" ry="6" fill="#C85A1E"/>

    <!-- NECK -->
    <rect x="57" y="82" width="26" height="20" rx="10" fill="#F4793B"/>

    <!-- HEAD -->
    <ellipse cx="70" cy="70" rx="34" ry="32" fill="#F4793B"/>

    <!-- EARS - left -->
    <polygon points="38,42 24,14 52,28" fill="#F4793B"/>
    <polygon points="40,40 28,20 50,30" fill="#C85A1E"/>
    <!-- EARS - right -->
    <polygon points="102,42 116,14 88,28" fill="#F4793B"/>
    <polygon points="100,40 112,20 90,30" fill="#C85A1E"/>

    <!-- FACE - white muzzle -->
    <ellipse cx="70" cy="80" rx="18" ry="14" fill="#FDE8D8"/>

    <!-- NOSE -->
    <ellipse cx="70" cy="76" rx="5" ry="3.5" fill="#C85A1E"/>

    <!-- MOUTH - happy -->
    <path id="pipMouthHappy" d="M 62 82 Q 70 90 78 82" stroke="#C85A1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- MOUTH - sad (hidden by default) -->
    <path id="pipMouthSad" d="M 62 88 Q 70 82 78 88" stroke="#C85A1E" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>

    <!-- EYES - left -->
    <g class="pip-eye-l" style="transform-origin: 56px 62px;">
      <ellipse cx="56" cy="62" rx="7" ry="7" fill="white"/>
      <ellipse cx="57" cy="63" rx="4" ry="4" fill="#2C2C2A"/>
      <ellipse cx="59" cy="61" rx="1.5" ry="1.5" fill="white"/>
    </g>

    <!-- EYES - right -->
    <g class="pip-eye-r" style="transform-origin: 84px 62px;">
      <ellipse cx="84" cy="62" rx="7" ry="7" fill="white"/>
      <ellipse cx="85" cy="63" rx="4" ry="4" fill="#2C2C2A"/>
      <ellipse cx="87" cy="61" rx="1.5" ry="1.5" fill="white"/>
    </g>

    <!-- CHEEK blush marks -->
    <ellipse cx="47" cy="74" rx="6" ry="3.5" fill="#F4A27A" opacity="0.5"/>
    <ellipse cx="93" cy="74" rx="6" ry="3.5" fill="#F4A27A" opacity="0.5"/>

    <!-- STRIPE on forehead -->
    <path d="M 70 40 Q 66 52 64 58" stroke="#C85A1E" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 70 40 Q 74 52 76 58" stroke="#C85A1E" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  </svg>

  <!-- Ground -->
  <div class="pip-ground"></div>
</div>

<!-- ════════════════════════════════
     MAIN CARD

<script>
'use strict';

// ════════════════════════════════
//  PIP THE FOX — companion logic
// ════════════════════════════════

const pip = document.getElementById('pip');
const pipBubble = document.getElementById('pipBubble');
let pipBubbleTimer = null;
let pipStateTimer = null;

const messages = {
  greet:     ["Hi! I'm Pip! 🦊", "Let's learn together!", "You're going to do great! 🌟"],
  codeTyping:["Looking good! 🎮", "Almost there...", "Type your code! 🔢"],
  codeWrong: ["Oops! Try again 😅", "Ask your grown-up 🏠", "Check the code! 🤔"],
  codeRight: ["Yes!! Let's go! 🎉", "Wahoo! Play time! 🦊", "You're in! Yay! ⭐"],
  counting:  ["I love counting! 🔢", "Let's count together!", "Numbers are fun! 🎉"],
  comparison:["Which is bigger? 🤔", "I'll help you! 💪", "Think carefully! 🧠"],
  patterns:  ["I love patterns! 🧩", "Can you spot it? 🔍", "You've got this! ✨"],
  music:     ["Music time! 🎵", "La la la! 🎶", "I love melodies! 🎼"],
  skill:     ["Show them what you know!", "You're so clever! 🌟", "I believe in you! 💪"],
  tap:       ["Hehe! That tickles! 😄", "Pip says hi! 👋", "Woof! I mean... fox! 🦊", "Play with me! 🎮"],
  loading:   ["Pip is running ahead! 🏃", "Almost ready! ⭐", "Here we go! 🚀"]
};

const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function pipSay(text, duration=3000) {
  clearTimeout(pipBubbleTimer);
  pipBubble.textContent = text;
  pipBubble.classList.remove('hidden');
  if(duration > 0) {
    pipBubbleTimer = setTimeout(() => pipBubble.classList.add('hidden'), duration);
  }
}

function pipAnimate(state, duration=1000) {
  clearTimeout(pipStateTimer);
  pip.className = 'pip-container ' + state;
  // Mouth change
  const mouthHappy = document.getElementById('pipMouthHappy');
  const mouthSad   = document.getElementById('pipMouthSad');
  if(state === 'sad') {
    mouthHappy.setAttribute('opacity','0');
    mouthSad.setAttribute('opacity','1');
  } else {
    mouthHappy.setAttribute('opacity','1');
    mouthSad.setAttribute('opacity','0');
  }
  pipStateTimer = setTimeout(() => {
    pip.className = 'pip-container'; // back to idle
    mouthHappy.setAttribute('opacity','1');
    mouthSad.setAttribute('opacity','0');
  }, duration);
}

// Tap handler — Pip reacts when child taps/clicks him
function pipTap() {
  pipAnimate('happy', 800);
  pipSay(pick(messages.tap), 2500);
}

// Greet on page load
window.addEventListener('load', () => {
  setTimeout(() => {
    pipAnimate('wave', 1200);
    pipSay(pick(messages.greet), 4000);
  }, 700);
  // Pip says something encouraging after the greeting
  setTimeout(() => {
    if(!document.getElementById('statePlay').classList.contains('active')) {
      pipSay(pick(messages.codeTyping), 3000);
    }
  }, 5500);
});

// ════════════════════════════════
//  CODE INPUT LOGIC
// ════════════════════════════════
const codeInputs = Array.from({length:6}, (_,i) => document.getElementById('c'+i));

codeInputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    const val = input.value.replace(/\D/g,'').slice(-1);
    input.value = val;
    input.classList.toggle('filled', !!val);
    if(val && idx < 5) codeInputs[idx+1].focus();
    updatePlayBtn();
    // Pip reacts to each digit
    if(val) { pipAnimate('happy', 400); }
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Backspace' && !input.value && idx > 0) {
      codeInputs[idx-1].focus();
      codeInputs[idx-1].value = '';
      codeInputs[idx-1].classList.remove('filled');
      updatePlayBtn();
    }
    if(e.key === 'Enter') checkCode();
  });

  input.addEventListener('paste', e => {
    e.preventDefault();
    const pasted = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
    pasted.slice(0,6).split('').forEach((d,i) => {
      if(codeInputs[i]) {
        codeInputs[i].value = d;
        codeInputs[i].classList.toggle('filled', !!d);
      }
    });
    const lastFilled = Math.min(pasted.length, 5);
    if(codeInputs[lastFilled]) codeInputs[lastFilled].focus();
    updatePlayBtn();
    pipAnimate('celebrate', 800);
    pipSay('Nice paste! 🚀', 2000);
  });

  input.addEventListener('focus', () => {
    // Pip watches the child type
    if(Math.random() > 0.7) pipSay(pick(messages.codeTyping), 2000);
  });
});

function updatePlayBtn() {
  const code = getEnteredCode();
  document.getElementById('playBtn').disabled = code.length < 6;
}

function getEnteredCode() {
  return codeInputs.map(i => i.value).join('');
}

// ════════════════════════════════
//  CODE VALIDATION
// ════════════════════════════════
function checkCode() {
  const entered = getEnteredCode();
  if(entered.length < 6) return;

  // Clear previous errors
  document.getElementById('errorMsg').classList.remove('show');
  codeInputs.forEach(i => i.classList.remove('error'));

  const storedCode = localStorage.getItem('nf_code');

  if(!storedCode || entered !== storedCode) {
    // Wrong code
    codeInputs.forEach(i => i.classList.add('error'));
    document.getElementById('errorMsg').textContent = "That code doesn't match — check with your grown-up!";
    document.getElementById('errorMsg').classList.add('show');
    pipAnimate('sad', 1000);
    pipSay(pick(messages.codeWrong), 3000);
    setTimeout(() => codeInputs.forEach(i => i.classList.remove('error')), 500);
    return;
  }

  // Correct!
  pipAnimate('celebrate', 1200);
  pipSay(pick(messages.codeRight), 2500);
  setState('stateLoading');
  document.getElementById('loadingEmoji').textContent = '🦊';
  document.getElementById('loadingText').textContent = 'Pip is running ahead!';
  pip.classList.add('run');

  setTimeout(() => {
    pip.classList.remove('run');
    enterPlayArea();
  }, 1200);
}

// ════════════════════════════════
//  PLAY AREA
// ════════════════════════════════
function enterPlayArea() {
  const child = getFromLS('nf_child');
  const assessment = getFromLS('nf_assessment');
  const name = child?.name || 'Explorer';

  document.getElementById('childGreeting').textContent = 'Hi, ' + name + '! 👋';
  document.getElementById('childSub').textContent = assessment
    ? 'Great to see you! Pick a game to play with Pip!'
    : 'Let\'s play! Pick a game below!';

  renderStars(Math.min((assessment?.sessions||0) * 2, 10));
  setState('statePlay');

  // Pip greets the child by name
  setTimeout(() => {
    pipAnimate('wave', 1200);
    pipSay('Hi ' + name + '! 🦊 Let\'s go!', 3500);
  }, 300);

  // Pip gives periodic encouragement
  startPipEncouragement();
}

function renderStars(count) {
  const row = document.getElementById('starsRow');
  row.innerHTML = '';
  for(let i=0; i<10; i++) {
    const s = document.createElement('span');
    s.className = 'star-item' + (i<count ? ' earned' : '');
    s.textContent = i<count ? '⭐' : '☆';
    s.style.animationDelay = (i*0.08)+'s';
    s.setAttribute('aria-hidden','true');
    row.appendChild(s);
  }
}

let encourageInterval = null;
function startPipEncouragement() {
  clearInterval(encourageInterval);
  const encouragements = [
    "You're doing amazing! 🌟",
    "Pip is rooting for you! 🦊",
    "Keep going! You've got this! 💪",
    "Pip thinks you're brilliant! ✨",
    "Learning is so fun! 🎉",
    "You make Pip so happy! 😄"
  ];
  let idx = 0;
  encourageInterval = setInterval(() => {
    if(document.getElementById('statePlay').classList.contains('active')) {
      pipSay(encouragements[idx % encouragements.length], 3000);
      idx++;
    }
  }, 12000);
}

// ════════════════════════════════
//  GAME LAUNCH
// ════════════════════════════════
function launchGame(type, name) {
  clearInterval(encourageInterval);

  const msgMap = {
    counting: messages.counting,
    comparison: messages.comparison,
    patterns: messages.patterns,
    music: messages.music
  };

  pipAnimate('celebrate', 900);
  pipSay(pick(msgMap[type]||messages.loading), 2500);

  setState('stateLoading');
  document.getElementById('loadingEmoji').textContent = {
    counting:'🔢', comparison:'⚖️', patterns:'🧩', music:'🎵'
  }[type]||'🎮';
  document.getElementById('loadingText').textContent = 'Loading ' + name + '...';
  pip.className = 'pip-container run';

  // Go to play.html (learning) not assessment.html (diagnostic)
  setTimeout(() => { window.location.href = 'play.html?game=' + type; }, 1000);
}

function launchSkillCheck() {
  clearInterval(encourageInterval);
  pipAnimate('wave', 900);
  pipSay(pick(messages.skill), 2000);
  setState('stateLoading');
  document.getElementById('loadingEmoji').textContent = '🎯';
  document.getElementById('loadingText').textContent = 'Starting Skill Check...';
  pip.className = 'pip-container run';
  setTimeout(() => { window.location.href = 'assessment.html'; }, 900);
}

// ════════════════════════════════
//  STATE SWITCHER
// ════════════════════════════════
function setState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ════════════════════════════════
//  LOCALSTORAGE HELPERS
// ════════════════════════════════
function getFromLS(key) {
  try { return JSON.parse(localStorage.getItem(key)||'null'); }
  catch(e) { return null; }
}

// Focus first input on load
codeInputs[0].focus();

// ── If returning from a game, skip code screen ──
// play.html sets nf_already_auth so child goes straight to tiles
(function checkAlreadyAuth(){
  const alreadyAuth = sessionStorage.getItem('nf_already_auth');
  if(alreadyAuth){
    sessionStorage.removeItem('nf_already_auth');
    // Verify the child data still exists before skipping code
    const child = getFromLS('nf_child') || getFromLS('nf_children')?.[0];
    if(child){
      enterPlayArea();
      return;
    }
  }
})();
</script>
</body>
</html>
